name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: file:./test.db
      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
        env:
          DATABASE_URL: file:./test.db
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./test.db

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -b
      - name: Build
        run: npm run build

  format:
    name: Prettier format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend, format]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f apps/backend/Dockerfile -t netdraw-backend:ci .
      - name: Build frontend image
        run: docker build -f apps/frontend/Dockerfile -t netdraw-frontend:ci .
