name: netdraw

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: netdraw/backend:0.1.0
    container_name: netdraw-backend
    restart: unless-stopped
    user: '10001:10001'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: file:/data/netdraw.db
      DATA_DIR: /data
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: info
      AUTOSAVE_INTERVAL_MS: '30000'
      RATE_LIMIT_MAX: '300'
      RATE_LIMIT_WINDOW: '1 minute'
    volumes:
      - netdraw-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: netdraw/frontend:0.1.0
    container_name: netdraw-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  netdraw-data:
    name: netdraw-data
